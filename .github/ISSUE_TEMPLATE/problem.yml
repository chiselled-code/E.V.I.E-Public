name: Report a problem
description: Something isn't working, an answer or fact is wrong, or something is hard to use or see.
title: "Problem: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping make E.V.I.E better.

        **Everything here is public.** Please don't include a child's name, photo, school or anything else that could identify them. If a screenshot shows a learner's name, cover it first.
  - type: dropdown
    id: kind
    attributes:
      label: What kind of problem?
      options:
        - Something doesn't work (it froze, a button does nothing, it won't load)
        - A wrong answer, fact or spelling
        - Hard to use, see or hear
        - Something else
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Which game or page?
      placeholder: "For example: Number Bonds, or the grown-ups' page"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you see or hear? If it's a wrong answer, what was the question?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened?
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: How can we make it happen? (optional)
      description: The steps, if you know them. Which step (Starting, Growing or Stretching) was the learner on?
    validations:
      required: false
  - type: textarea
    id: details
    attributes:
      label: Version and device
      description: Filled in for you when you report from inside E.V.I.E (For grown-ups → Report a problem). Otherwise, tell us the device and browser, for example "iPad, Safari" or "Android phone, Chrome".
      render: text
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I haven't included a child's name, photo or anything else that could identify them.
          required: true
